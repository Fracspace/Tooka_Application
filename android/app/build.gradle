import java.util.Properties
import java.io.FileInputStream

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * Load release keystore properties
 */
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.fracspace.tooka"

    defaultConfig {
        applicationId "com.fracspace.tooka"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 9
        versionName "1.0.5"
    }

    signingConfigs {

        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }

        release {
            if (keystorePropertiesFile.exists()) {
                // storeFile file(keystoreProperties["storeFile"])
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {

        debug {
            signingConfig signingConfigs.debug
        }

        release {

            // Without key.properties there is no release signing config; the guard at
            // the end of this file then fails release tasks instead of quietly
            // producing a build signed with the public debug key.
            signingConfig keystorePropertiesFile.exists()
                    ? signingConfigs.release
                    : null

            minifyEnabled enableProguardInReleaseBuilds

            proguardFiles getDefaultProguardFile("proguard-android.txt"),
                    "proguard-rules.pro"
        }
    }
}

// Debug builds never need the release key, so only release tasks are blocked.
gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any { task ->
        task.project == project && task.name ==~ /(assemble|bundle|install|package)Release/
    }
    if (buildsRelease && !keystorePropertiesFile.exists()) {
        throw new GradleException(
            "android/key.properties is missing, so this release build cannot be signed " +
            "with the Tooka upload key. Add key.properties (see the signingConfigs block) " +
            "and build again."
        )
    }
}

dependencies {

    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"
apply plugin: "com.google.gms.google-services"
apply plugin: "com.google.firebase.crashlytics"