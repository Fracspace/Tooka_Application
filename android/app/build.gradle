import java.util.Properties
import java.io.FileInputStream

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * Load release keystore properties
 */
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = true

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.fracspace.tooka"

    defaultConfig {
        applicationId "com.fracspace.tooka"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10
        versionName "1.0.6"
    }

    signingConfigs {

        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }

        release {
            if (keystorePropertiesFile.exists()) {
                // storeFile file(keystoreProperties["storeFile"])
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    // Calls are voice only, so Agora's optional add-ons (video, face, lip sync,
    // spatial audio, screen capture...) are left out: about 25 MB per device.
    // None of what the core SDK loads depends on them; the AI noise-suppression
    // and echo-cancellation add-ons stay.
    packaging {
        jniLibs {
            excludes += [
                '**/libagora_audio_beauty_extension.so',
                '**/libagora_clear_vision_extension.so',
                '**/libagora_content_inspect_extension.so',
                '**/libagora_face_capture_extension.so',
                '**/libagora_face_detection_extension.so',
                '**/libagora_lip_sync_extension.so',
                '**/libagora_screen_capture_extension.so',
                '**/libagora_segmentation_extension.so',
                '**/libagora_spatial_audio_extension.so',
                '**/libagora_video_av1_encoder_extension.so',
                '**/libagora_video_encoder_extension.so',
                '**/libagora_video_quality_analyzer_extension.so',
                '**/libvideo_enc.so',
            ]
        }
    }

    buildTypes {

        debug {
            signingConfig signingConfigs.debug
        }

        release {

            // Without key.properties there is no release signing config; the guard at
            // the end of this file then fails release tasks instead of quietly
            // producing a build signed with the public debug key.
            signingConfig keystorePropertiesFile.exists()
                    ? signingConfigs.release
                    : null

            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds

            proguardFiles getDefaultProguardFile("proguard-android.txt"),
                    "proguard-rules.pro"
        }
    }
}

// Debug builds never need the release key, so only release tasks are blocked.
gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any { task ->
        task.project == project && task.name ==~ /(assemble|bundle|install|package)Release/
    }
    if (buildsRelease && !keystorePropertiesFile.exists()) {
        throw new GradleException(
            "android/key.properties is missing, so this release build cannot be signed " +
            "with the Tooka upload key. Add key.properties (see the signingConfigs block) " +
            "and build again."
        )
    }
}

dependencies {

    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Only Ionicons is used; the other icon fonts would add ~3 MB.
project.ext.vectoricons = [iconFontNames: ['Ionicons.ttf']]
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"
apply plugin: "com.google.gms.google-services"
apply plugin: "com.google.firebase.crashlytics"